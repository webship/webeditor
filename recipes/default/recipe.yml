name: Web Editor - Default
description: A recipe to manage default installed modules, configs and permissions.
type: install
install:
  - editor
  - filter
  - media
  - ckeditor5
  - linkit
  - extlink
  - editor_advanced_link
  - token_filter
input:
  default_langcode:
    data_type: string
    description: 'The default language of the site. Saved with the settings that hold translatable text.'
    constraints:
      NotBlank: []
    default:
      source: config
      config: ['system.site', 'default_langcode']
config:
  strict: false
  import:
    linkit: '*'
    extlink: '*'
    editor_advanced_link: '*'
    token_filter: '*'
  actions:
    # The settings hold translatable text, so they need a language code.
    extlink.settings:
      simpleConfigUpdate:
        langcode: ${default_langcode}
