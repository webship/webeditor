name: Web Editor - Default
description: A recipe to manage default installed modules, configs and permissions.
type: install
install:
  - editor
  - filter
  - media
  - ckeditor5
  - linkit
  - extlink
  - editor_advanced_link
  - token_filter
  # Last, after its dependencies: the Web Editor module itself.
  - webeditor
config:
  strict: false
  import:
    linkit: '*'
    extlink: '*'
    editor_advanced_link: '*'
    token_filter: '*'
  actions:
    # The settings hold translatable text in English, so they need a language
    # code. A fixed value: recipe inputs are not collected when the recipe is
    # applied from hook_install() or from an installer batch.
    extlink.settings:
      simpleConfigUpdate:
        langcode: en
